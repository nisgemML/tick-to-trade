name: ci
on: [push, pull_request]

jobs:
  integration-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build -j 2
      - name: integration tests
        run: ctest --test-dir build --output-on-failure
      - name: prove CHECK active under Release
        run: |
          cmake --build build -j 2 --target test_check_macro_fails
          if ./build/test_check_macro_fails; then
            echo "ERROR: deliberate failing CHECK passed under Release" >&2
            exit 1
          fi

  integration-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++
      - run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j 2
          ctest --test-dir build-asan --output-on-failure
      - name: exercise non-ctest tools under ASan+UBSan
        run: |
          ./build-asan/run_feed_pipeline 8000
          ./build-asan/bench_tick_to_trade 8000
          ./build-asan/run_market_maker_demo 10000

  integration-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++
      - run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan -j 2
          ctest --test-dir build-tsan --output-on-failure
      - name: exercise non-ctest tools under TSan
        run: |
          # run_feed_pipeline and bench_tick_to_trade are the only two
          # call sites that pass a real (non-zero) recv_ns into
          # submit_with_ts() — every ctest entry goes through plain
          # submit(), which always passes recv_ns=0, so the
          # recv_by_order_ map is never even touched by any registered
          # test. That's exactly how a real, TSan-confirmed data race in
          # this exact map survived undetected until these two tools were
          # run directly, by hand, outside CI. Run them here too so this
          # class of bug can't hide behind "the registered tests don't
          # happen to exercise the racy path" again.
          #
          # run_market_maker_demo is the same story a second time: its
          # first version read OrderBook::best_quote() directly from this
          # thread while the engine's own matching thread was still
          # running — a real, TSan-confirmed race with no ctest coverage
          # at all, only found by running the tool itself under TSan.
          ./build-tsan/run_feed_pipeline 8000
          ./build-tsan/bench_tick_to_trade 8000
          ./build-tsan/bench_tick_to_trade 8000 burst
          ./build-tsan/run_market_maker_demo 10000
          ./build-tsan/run_market_maker_demo 15000 300

  integration-numa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libnuma-dev
      - name: reserve hugepages + mount hugetlbfs
        run: |
          echo 64 | sudo tee /proc/sys/vm/nr_hugepages
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge
      - name: configure + build (HFT_WITH_NUMA=ON)
        run: |
          cmake -S . -B build-numa -DCMAKE_BUILD_TYPE=Release -DHFT_WITH_NUMA=ON
          cmake --build build-numa -j 2
      - name: integration tests
        run: ctest --test-dir build-numa --output-on-failure
      - name: live pipeline with a real NUMA/hugepage-backed GapBuffer
        run: |
          sudo rm -rf /var/run/dpdk
          rm -f live_fills.log
          ./build-numa/run_live_pipeline 239.1.1.1 15001 lo 6 &
          sleep 1
          ./build-numa/send_live_itch 239.1.1.1 15001 lo 2000 200
          wait
      - name: gap-recovery stress benchmark (NUMA build)
        run: ./build-numa/bench_gapbuffer_numa 50

  integration-iouring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ liburing-dev
      - name: configure + build (HFT_WITH_IOURING=ON)
        run: |
          cmake -S . -B build-iouring -DCMAKE_BUILD_TYPE=Release -DHFT_WITH_IOURING=ON
          cmake --build build-iouring -j 2
      - name: integration tests (io_uring sink)
        run: ctest --test-dir build-iouring --output-on-failure
      - name: io_uring and blocking sinks must produce identical output
        run: |
          # Same semantic check as the one that proved this wiring correct,
          # not just that it compiles: run the same input through both
          # sink implementations and diff every field except timestamp_ns.
          # See BUGS_FOUND.md #12 and scripts/compare_fill_logs.py.
          cmake -S . -B build-default -DCMAKE_BUILD_TYPE=Release
          cmake --build build-default -j 2
          rm -f feed_fills.log
          ./build-default/run_feed_pipeline 8000
          cp feed_fills.log /tmp/fills_default.log
          rm -f feed_fills.log
          ./build-iouring/run_feed_pipeline 8000
          cp feed_fills.log /tmp/fills_iouring.log
          python3 scripts/compare_fill_logs.py /tmp/fills_default.log /tmp/fills_iouring.log

  integration-numa-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libnuma-dev
      - name: reserve hugepages + mount hugetlbfs
        run: |
          echo 64 | sudo tee /proc/sys/vm/nr_hugepages
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge
      - run: |
          cmake -S . -B build-numa-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHFT_WITH_NUMA=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-numa-tsan -j 2
          ctest --test-dir build-numa-tsan --output-on-failure
      - name: live pipeline under TSan (NUMA/hugepage-backed GapBuffer)
        run: |
          sudo rm -rf /var/run/dpdk
          rm -f live_fills.log
          ./build-numa-tsan/run_live_pipeline 239.1.1.1 15001 lo 6 &
          sleep 1
          ./build-numa-tsan/send_live_itch 239.1.1.1 15001 lo 2000 200
          wait

  integration-iouring-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ liburing-dev
      - run: |
          cmake -S . -B build-iouring-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHFT_WITH_IOURING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-iouring-tsan -j 2
          ctest --test-dir build-iouring-tsan --output-on-failure
      - name: exercise non-ctest tools under TSan (io_uring sink)
        run: |
          ./build-iouring-tsan/run_feed_pipeline 8000
          ./build-iouring-tsan/bench_tick_to_trade 8000
          ./build-iouring-tsan/bench_tick_to_trade 8000 burst
          ./build-iouring-tsan/run_market_maker_demo 10000
          ./build-iouring-tsan/run_market_maker_demo 15000 300

  # Vendored component suites — catch broken snapshots before an interviewer does
  vendor-options-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: build + test options-engine
        working-directory: third_party/options-engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure

  vendor-mpsc-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: build + test mpsc-queue
        working-directory: third_party/mpsc-queue
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure

  vendor-udp-multicast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: build + test udp-multicast-receiver
        working-directory: third_party/udp-multicast-receiver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure

  vendor-io-uring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ liburing-dev
      - name: build + test io-uring-queue
        working-directory: third_party/io-uring-queue
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
